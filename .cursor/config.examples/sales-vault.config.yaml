# Sales Vault — copy to `.cursor/config.yaml` and fill placeholders.
# Same key layout as sales-audit.config.yaml; values are Vault-specific.

modules:
  api: <vault-api>
  ui: vault-nextjs
  openapi: <path-to-openapi.yaml>
  brd: vault-source-of-truth.md
  ibmi_source: <optional-ibmi-replica>
  calculations_schema: artifacts/calculations/calculation-catalog.schema.json

vault:
  source_of_truth: vault-source-of-truth.md
  scope:
    in:
      - VACE
      - VACI
      - VABI
      - VAOD
      - VACO
    out:
      - VACX
      - VAEX
      - DDE
    notes: STE clerk flows are auditor-owned (VACE Option 8 routes out) — reference only
  screenconversion:
    screens_root: src/screens/
    traceability: src/lib/traceability/screenRequirements.ts
    api_client: src/lib/api/
    api_mode_env: NEXT_PUBLIC_VAULT_API_MODE

intake:
  transcripts: artifacts/intake/transcripts/
  notes: artifacts/intake/
  supporting_docs: artifacts/intake/supporting/

brd_drafts: artifacts/brd/
sprints: artifacts/sprints/

docs:
  feature_notes: docs/feature.md
  test_matrix: docs/test-matrix.md
  adr: docs/adr/
  harness_progress: docs/harness/progress.md

artifacts:
  audit: artifacts/audit/
  issue_logs: artifacts/issues/
  archive_asset: artifacts/archive_asset/
  extract_calculations_archive: artifacts/archive_asset/extract-calculations/
  application_summary_html: artifacts/sales-vault-application-summary.html
  application_summary_pdf: artifacts/sales-vault-application-summary.pdf
  provenance: artifacts/sprints/{sprint-id}-provenance.md
  test_strategy: artifacts/sprints/{sprint-id}-test-strategy.md
  api_contract_checklist: artifacts/sprints/{sprint-id}-api-contract.md
  test_results: artifacts/test-results-{date}.md
  e2e_test_results: artifacts/e2e-test-results-{timestamp}.md
  diagrams: artifacts/diagrams/
  calculations: artifacts/calculations/
  calculations_module: artifacts/calculations/{module}-calculations.json

quality_gates:
  api_unit_line_coverage_min: 0.70
  api_unit_branch_coverage_target: 0.70
  java_home_for_tests: <jdk-17-home>
  ui_shared_component_manifest: .cursor/templates/ui-shared-component-manifest.yaml
  ui_session_defaults_skill: .cursor/skills/ati-session-defaults/SKILL.md

execution:
  max_iterations: 3

pipeline:
  intake_command: generate-user-story
  plan_command: plan-governed-stories
  deliver_command: deliver-sprint
  fix_command: fix-issue

evals:
  root: evals
  rule_source: vault-source-of-truth.md
  rule_id_pattern: 'FR-[0-9]+[a-z]?|BR-[0-9]+|CALC-[A-Z0-9-]+|INT-[0-9]+'
  module_brds_glob: artifacts/brd/*-BRD-draft.md
  test_commands:
    api: cd <vault-api> && mvn test
    ui: cd vault-nextjs && npm test
    e2e: cd vault-nextjs && npm run test:e2e
  owning_paths:
    api: <vault-api>/**
    ui: vault-nextjs/**
    contract: contracts/**
